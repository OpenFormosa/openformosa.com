<aside class="post-feedback section-pad" data-post-feedback aria-labelledby="post-feedback-title">
  <div class="post-feedback__card">
    <p class="eyebrow" data-i18n="post_fb_eyebrow">Quick Feedback</p>
    <h2 id="post-feedback-title" data-i18n="post_fb_title">Was this build log helpful — and what do you want next?</h2>
    <div class="post-feedback__actions" role="group" aria-label="Article feedback">
      <button type="button" class="post-feedback__btn" data-feedback-type="helpful" aria-pressed="false" data-i18n="post_fb_helpful">Helpful</button>
      <button type="button" class="post-feedback__btn" data-feedback-type="want_to_run" aria-pressed="false" data-i18n="post_fb_run">I want to run / deploy this</button>
      <button type="button" class="post-feedback__btn" data-feedback-type="want_more_detail" aria-pressed="false" data-i18n="post_fb_detail">Want deeper eval / recipe</button>
      <button type="button" class="post-feedback__btn" data-feedback-type="have_use_case" aria-pressed="false" data-i18n="post_fb_use_case">I have a Taiwan use case</button>
      <button type="button" class="post-feedback__btn" data-feedback-type="need_quickstart" aria-pressed="false" data-i18n="post_fb_quickstart">Need quickstart / how to run</button>
      <button type="button" class="post-feedback__btn" data-feedback-type="hard_to_follow" aria-pressed="false" data-i18n="post_fb_hard">Too technical / hard to follow</button>
    </div>
    <p class="post-feedback__status" data-feedback-status aria-live="polite"></p>
  </div>
</aside>

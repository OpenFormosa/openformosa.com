      research:
        - "以 Barbet 1B Base 進行指令微調，長文樣本佔訓練資料的一大部分。評測細節隨模型卡公開。"
    en:
      tagline: "The instruction-following version of Barbet. It takes instructions and can answer after reading long documents."
      analogy: "Barbet 1B Base is the well-read new colleague. Instruct is the same colleague after onboarding, ready to take on work."
      public:
        - "In development and not releasing this year. It will ship with a usage report on what it does well and what it does not."
      research:
        - "Instruction-tuned from Barbet 1B Base, with long-document samples making up a large share of the data. Evaluation details will come with the model card."


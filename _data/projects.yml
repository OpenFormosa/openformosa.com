      analogy: "BlueMagpie 負責「說」，BlackBear 負責「聽」。"
      public:
        - "模型已訓練完成，正在檢查資料與模型，是下一個釋出的模型。釋出時會附上白話的使用報告、使用說明與 demo。"
      research:
        - "接在 Barbet 底座上的任務分支。技術細節會在釋出時與模型卡一起公開。"
    en:
      tagline: "Speech recognition that turns Taiwan Mandarin, Taigi, and mixed Chinese and English speech into text."
      analogy: "BlueMagpie speaks. BlackBear listens."
      public:
        - "The model is trained, and data and model checks are under way. It is the next release and will ship with a plain-language usage report, a guide, and a demo."
      research:
        - "A task branch on the Barbet base. Technical details will be published with the model card at release."


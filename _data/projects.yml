  # ------------------------------------------------------------- tokenizer
  - id: pangolin
    name: "PangolinTokenizer"
    category: tokenizer
    status: shipped
    accent: pangolin
    crest: tokenizer
    role: "Tokenizer"
    links:
      - url: "https://huggingface.co/OpenFormosa/PangolinTokenizer"
        zh: "Hugging Face 模型"
        en: "Hugging Face model"
      - url: "/blog/2026/06/20/pangolin-tokenizer/"
        zh: "技術紀錄"
        en: "Technical log"
    try:
      url: "https://huggingface.co/OpenFormosa/PangolinTokenizer"
      zh: "到 Hugging Face 看詞彙表"
      en: "See it on Hugging Face"
    try_dev:
      zh: "用 Transformers 切一句話"
      en: "Tokenize a sentence with Transformers"
      code: |
        from transformers import AutoTokenizer
        tok = AutoTokenizer.from_pretrained("OpenFormosa/PangolinTokenizer")
        print(tok.tokenize("這個 feature 明天上線"))
    zh:
      tagline: "專門為台灣文字設計的斷詞器，用更少的片段表示同樣的內容。"
      analogy: "像打包行李。捲得好，同一個箱子就能裝更多東西。斷詞切得越省，模型同樣的記憶空間就能放進越多台灣的文字。"
      public:
        - "熟悉繁體中文、注音、台羅、白話字、台語漢字、客語詞、中英夾雜與程式碼。"
        - "和 8 個常見斷詞器比較，它表示同樣的文字用的 token 最少，而詞彙表只有主流多語言斷詞器的約三分之一到一半。"
        - "Barbet 用的就是它。"
      try_note: "它是給模型用的元件。開發者可以用一行程式載入它，看看一句話會被切成哪些片段。"
      research:
        - "Byte-level BPE，114,688 個 merges，另加 4 個 special tokens。用 UbiTok 訓練。"
        - "PangolinBench 上比較 9 個 tokenizer：整體 0.485 tokens/character 為最低，第二名 0.486，差距很小。優勢主要在核心台灣華語、台灣專名與語音逐字稿格式。"
        - "原生支援 rich transcription 標記，並避開密集的 timestamp token 區段。"
      join: "可以提供更多台灣語料類型的評測切面，或回報切得不好的例子。"
    en:
      tagline: "A tokenizer built for Taiwan text that represents the same content with fewer pieces."
      analogy: "Like packing a suitcase. Roll things well and more fits in the same box. A more efficient tokenizer lets the same model memory hold more Taiwan text."
      public:
        - "It handles Traditional Chinese, Bopomofo, Tailo, POJ, Taigi Han characters, Hakka terms, mixed Chinese and English, and code."
        - "Compared with 8 common tokenizers, it uses the fewest tokens for the same text, with a vocabulary about one third to one half the size of mainstream multilingual tokenizers."
        - "Barbet uses it."
      try_note: "It is a component for models. Developers can load it in one line and see how a sentence gets split."
      research:
        - "Byte-level BPE with 114,688 merges plus 4 special tokens, trained with UbiTok."
        - "On PangolinBench across 9 tokenizers: lowest overall 0.485 tokens/character. The runner-up is 0.486, so the margin is small. The advantage is mainly on core Taiwan Mandarin, Taiwan proper nouns, and speech-transcript formats."
        - "Native rich-transcription tags, with dense timestamp-token ranges avoided."
      join: "Contribute evaluation slices for more kinds of Taiwan text, or report examples it splits badly."

  - id: ubi_tokenizer
    name: "ubi_tokenizer"
    category: tokenizer
    status: shipped
    accent: pangolin
    role: "Runtime"
    repo: "https://github.com/OpenFormosa/ubi_tokenizer"
    try_dev:
      zh: "從 GitHub 安裝並載入"
      en: "Install from GitHub and load"
      code: |
        pip install git+https://github.com/OpenFormosa/ubi_tokenizer
        python -c "from ubi_tokenizer import Tokenizer; \
          t = Tokenizer.from_file('tokenizer.json'); print(t.encode('大家好').tokens)"
    zh:
      tagline: "讓斷詞器在任何有 Python 的地方都能跑，不需要安裝其他套件。"
      analogy: "像一個萬用轉接頭。不管你的電腦或伺服器長什麼樣子，只要有 Python，就能用同一份斷詞器。"
      public:
        - "和業界常用的 Hugging Face 斷詞器讀寫同一種檔案格式。"
        - "適合在學校電腦、精簡伺服器或不方便安裝編譯工具的環境使用。"
      try_note: "這是給開發者的工具，沒有網頁 demo。"
      research:
        - "純 Python 標準函式庫實作，沒有 Rust、torch 或 transformers 依賴。"
        - "鏡像 <code>huggingface/tokenizers</code> 的 API：<code>Tokenizer</code>、<code>Encoding</code>、<code>AddedToken</code>，以及 normalizers、pre_tokenizers、models、processors、decoders、trainers 子模組。"
        - "讀寫相同的 <code>tokenizer.json</code>。內建 <code>BpeTrainer</code> 適合小語料與測試；大規模訓練請用 UbiTok。授權為 Apache 2.0。"
      join: "歡迎補測試、補文件，或回報和 Hugging Face 行為不一致的地方。"
    en:
      tagline: "Runs a tokenizer anywhere Python runs, with no other packages to install."
      analogy: "Like a universal travel adapter. Whatever your machine looks like, if it has Python, it can use the same tokenizer."
      public:
        - "It reads and writes the same file format as the widely used Hugging Face tokenizers."
        - "Useful on school machines, slim servers, or anywhere installing build tools is hard."
      try_note: "This is a developer tool with no web demo."
      research:
        - "Pure Python standard library. No Rust, torch, or transformers dependency."
        - "Mirrors the <code>huggingface/tokenizers</code> API: <code>Tokenizer</code>, <code>Encoding</code>, <code>AddedToken</code>, plus normalizers, pre_tokenizers, models, processors, decoders, and trainers."
        - "Same <code>tokenizer.json</code> format. The built-in <code>BpeTrainer</code> is for small corpora and tests. Use UbiTok for large-scale training. Apache 2.0."
      join: "Add tests or docs, or report behavior that differs from Hugging Face."

  - id: pangolinbench
    name: "PangolinBench"
    category: tokenizer
    status: shipped
    accent: pangolin
    role: "Benchmark"
    repo: "https://github.com/OpenFormosa/PangolinBench"
    try_dev:
      zh: "不需要任何斷詞器的冒煙測試"
      en: "Smoke test without any tokenizer"
      code: |
        git clone https://github.com/OpenFormosa/PangolinBench && cd PangolinBench
        python -m pangolinbench.cli --byte-roundtrip-test-adapter \
          --config configs/pangolinbench.yaml --output reports/report.json
    zh:
      tagline: "斷詞器的健康檢查表，專門檢查它處理台灣文字的表現。"
      analogy: "像汽車驗車。能發動還不夠，還要看油耗、煞車和燈。斷詞器能把字還原還不夠，還要看切得省不省、台灣專有名詞會不會被切碎。"
      public:
        - "檢查繁體中文、注音、台語與客語羅馬字、台灣專有名詞。"
        - "內建的測試資料是公開、可檢查的合成資料，沒有放入私人或有授權疑慮的語料。"
      try_note: "這是給開發者的工具。用一行指令就能先跑一次。"
      research:
        - "指標：roundtrip 正確性、壓縮率（tokens/character、tokens/byte、characters/token）、lexicon fertility、over-segmentation、script coverage、rich transcription JSON 穩定性，並回報詞彙表大小。"
        - "設計立場：byte-level 能還原所有 UTF-8，不等於對台灣文字有效率，所以正確性與效率要一起看。"
        - "內建 fixtures 是 synthetic、deterministic、license-clean。正式評測透過 manifest 接 held-out 語料，不把語料放進 repo。"
        - "另有訓練吞吐量 benchmark，需要 UbiTok。品質 benchmark 只用標準函式庫。"
      join: "可以提議新的評測切面或指標，或幫忙把結果整理成公開報告。"
    en:
      tagline: "A health check for tokenizers, focused on how they handle Taiwan text."
      analogy: "Like a car inspection. Starting the engine is not enough. You also check fuel use, brakes, and lights. Recovering the text is not enough for a tokenizer either. It also has to be efficient and keep Taiwan proper nouns intact."
      public:
        - "It checks Traditional Chinese, Bopomofo, Taigi and Hakka romanization, and Taiwan proper nouns."
        - "Built-in test data is synthetic and inspectable. No private or license-unclear text is included."
      try_note: "A developer tool. One command runs a first check."
      research:
        - "Metrics: roundtrip correctness, compression (tokens/character, tokens/byte, characters/token), lexicon fertility, over-segmentation, script coverage, rich-transcription JSON stability, plus vocabulary size."
        - "Design stance: byte-level roundtrip on any UTF-8 does not mean efficiency on Taiwan text, so correctness and efficiency are reported together."
        - "Built-in fixtures are synthetic, deterministic, and license-clean. Real evaluation plugs in held-out corpora through a manifest instead of committing them."
        - "An optional training-throughput benchmark needs UbiTok. The quality benchmark is stdlib only."
      join: "Propose new evaluation slices or metrics, or help turn results into public reports."

  # ---------------------------------------------------------------- skills
  - id: skills
    name: "Barbet Harness Library"
    category: skills
    status: shipped
    accent: barbet
    role: "Skills"
    repo: "https://github.com/OpenFormosa/barbet-harness-library"
    links:
      - url: "https://huggingface.co/datasets/OpenFormosa/barbet-long-context-sft"
        zh: "對應的 SFT 資料集"
        en: "Related SFT dataset"
      - url: "https://github.com/OpenFormosa/barbet-harness-library/blob/main/skills/tool-selection-and-arguments/SKILL.md"
        zh: "看一份技能範例"
        en: "Read a sample skill"
    try:
      url: "https://github.com/OpenFormosa/barbet-harness-library/blob/main/skills/tool-selection-and-arguments/SKILL.md"
      zh: "讀一份技能手冊"
      en: "Read a skill guide"
    try_dev:
      zh: "用 barbet-infer 跑一題"
      en: "Run one question with barbet-infer"
      code: |
        pip install -e '.[vllm]'
        barbet-infer run --family mini \
          --prompt '每箱 12 瓶，買 3 箱共有多少瓶？' --contract number \
          --output outputs/answer.jsonl
    zh:
      tagline: "給 AI 用的工作框架：64 份工作手冊，加上執行它們的推論工具。教模型遇到某類任務時該怎麼一步步做、怎麼自我檢查。"
      analogy: "像新人到職時拿到的標準作業流程。手冊寫清楚什麼時候該用、步驟是什麼、出錯怎麼辦、做完怎麼驗收。"
      public:
        - "涵蓋一般指令、寫程式、數學、使用工具、閱讀、科學與寫作。"
        - "不限 Barbet。任何語言模型都能讀這些手冊。"
        - "實驗結果：一個 1B 小模型在不改權重的情況下，加上技能與工具後，主要分數從 38.02% 提升到 50.39%。同樣條件下的 9B 模型是 76.24%，小模型仍有差距。"
      try_note: "每份技能都是一份可以直接閱讀的文件。"
      research:
        - "每個技能由 <code>skill.json</code> 生成 <code>SKILL.md</code>，另有機器可讀的 <code>catalog.json</code> 與含 SHA-256 的 <code>manifest.json</code>。正式使用時請固定 Git commit。"
        - "附 <code>barbet_inference</code>：Python API、<code>barbet-infer</code> CLI、本機 vLLM 與 vLLM 相容 HTTP 後端。"
        - "固定權重 test-time 實驗：646 題、3 個 seed、10 組設定的封存測試。受測模型是 MiniCPM5-1B，四領域主指標 38.02% → 50.39%（+12.37 pp，配對 95% CI +9.90 至 +14.97）。主評分包含輸出格式遵循；數學的事後診斷未顯示數值推理提升。"
        - "界線：部分技能由本地 Qwen 生成，經有限測試與審查，不是 human-verified。它們也沒有證明 Barbet 已學會路由、組合技能或使用 1M 上下文。"
        - "原創技能文字與工具採 Apache 2.0。"
      join: "這是最容易上手的參與入口。可以用 Issues 提議新技能，或修改 <code>skill.json</code> 後送 PR。"
    en:
      tagline: "A working harness for AI: 64 work guides plus the inference tools that run them. They teach a model how to approach a type of task step by step and how to check its own work."
      analogy: "Like the standard operating procedures a new hire receives. Each guide says when to use it, the steps, what to do when something fails, and how to verify the result."
      public:
        - "Covers general instructions, coding, math, tool use, reading, science, and writing."
        - "Not tied to Barbet. Any language model can read these guides."
        - "Result: a 1B model, with its weights unchanged, went from 38.02% to 50.39% on the main score after adding skills and tools. A 9B model under the same setup scored 76.24%, so the small model still lags."
      try_note: "Every skill is a document you can read directly."
      research:
        - "Each skill is generated from <code>skill.json</code> into <code>SKILL.md</code>, with a machine-readable <code>catalog.json</code> and a <code>manifest.json</code> with SHA-256 hashes. Pin a Git commit in production."
        - "Ships <code>barbet_inference</code>: Python API, the <code>barbet-infer</code> CLI, local vLLM, and vLLM-compatible HTTP backends."
        - "Frozen-weight test-time study: sealed test of 646 questions, 3 seeds, 10 configurations. The tested model is MiniCPM5-1B, main four-domain metric 38.02% → 50.39% (+12.37 pp, paired 95% CI +9.90 to +14.97). The score includes output-format compliance. A post-hoc math diagnosis shows no gain in numeric reasoning."
        - "Limits: some skills were generated by a local Qwen model with limited testing and review. They are not human-verified, and they do not show that Barbet has learned routing, skill composition, or 1M-context use."
        - "Original skill text and tooling are Apache 2.0."
      join: "The easiest place to start. Propose a new skill in Issues, or edit a <code>skill.json</code> and open a PR."

  # -------------------------------------------------------------- learning
  - id: opentaigi
    name: "咱來學台語 OpenTaigi"
    category: apps
    status: live
    accent: red
    role: "Learning"
    repo: "https://github.com/OpenFormosa/OpenTaigi"
    try:
      url: "https://openformosa.github.io/OpenTaigi/"
      zh: "開始學台語"
      en: "Start learning Taigi"
    zh:
      tagline: "把教育部公開的台語教材，整理成手機也好用的互動學習網站。"
      analogy: "原本是一本 217 頁的 PDF 課本。現在變成可以搜尋、可以聽、可以闖關的學習 app。"
      public:
        - "840 句生活台語，真人發音，可依 16 類主題搜尋。"
        - "852 個校正後的語詞，附台羅、華語與例詞。"
        - "初學、生活應用、進階讀寫三種程度路線，還有聽力闖關與語詞配對遊戲。"
      try_note: "打開網站就能開始，進度存在你的裝置上。"
      research:
        - "資料來自教育部《咱來學臺灣閩南語》與 Taiwanese-Corpus/Lan-Lai-Oh-Taigi 公開資料。網站程式不更動原始語句、羅馬字與音檔，教材著作權依原始來源。"
        - "原 PDF 含隱藏圖層與裁切內容。轉換腳本用 PyMuPDF 只讀取實際顯示的文字層，再輸出定位版與手機閱讀版共用的資料。"
        - "前端為 Next.js、React 與 TypeScript，push 到 main 後由 GitHub Actions 發佈到 GitHub Pages。"
      join: "可以回報錯字或音檔對不上的地方、改善介面，或分享給想學台語的人。"
    en:
      tagline: "Turns the Ministry of Education's open Taigi course into an interactive site that works well on phones."
      analogy: "It started as a 217-page PDF textbook. Now it is a learning app you can search, listen to, and play."
      public:
        - "840 everyday Taigi sentences with native-speaker audio, searchable across 16 topics."
        - "852 corrected words with Tailo, Mandarin, and example phrases."
        - "Three level paths, from beginner to advanced reading, plus listening challenges and word-matching games."
      try_note: "Open the site and start. Progress stays on your device."
      research:
        - "Data comes from the Ministry of Education course 咱來學臺灣閩南語 and the open Taiwanese-Corpus/Lan-Lai-Oh-Taigi repository. The site does not alter source sentences, romanization, or audio. Copyright follows the original sources."
        - "The source PDF has hidden layers and cropped content. The build script uses PyMuPDF to read only the visible text layer, then emits shared data for the positioned and mobile reading views."
        - "Built with Next.js, React, and TypeScript, deployed to GitHub Pages by GitHub Actions on every push to main."
      join: "Report typos or audio mismatches, improve the interface, or share it with someone learning Taigi."

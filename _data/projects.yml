# OpenFormosa project directory.
# One source of truth for /projects/ and the project list in llms.txt / llms-full.txt.
# Every number must come from the project's own repository or release report,
# with its test condition stated next to it. Values may contain inline HTML.

categories:
  - id: models
    zh:
      title: "AI 模型"
      desc: "會讀、會說的模型本體。Barbet 是共同底座，其他模型站在它上面。"
    en:
      title: "AI models"
      desc: "The models themselves. Barbet is the shared base, and the other models build on it."
  - id: tokenizer
    zh:
      title: "斷詞與評測"
      desc: "模型讀字之前，要先把句子切成小片段。這一組工具負責切字，也負責檢查切得好不好。"
    en:
      title: "Tokenizer and benchmarks"
      desc: "Before a model reads text, it splits sentences into small pieces. These tools do the splitting and check how well it is done."
  - id: skills
    zh:
      title: "技能與推論"
      desc: "讓模型照著步驟把事情做好的工作手冊，以及執行它們的工具。"
    en:
      title: "Skills and inference"
      desc: "Step-by-step work guides that help a model finish a task, plus the tools that run them."
  - id: apps
    zh:
      title: "應用"
      desc: "直接給人用的服務。第一個應用是學台語的網站，之後會有更多用 OpenFormosa 模型做出來的應用。"
    en:
      title: "Applications"
      desc: "Services people use directly. The first one is a Taigi learning site, and more apps built on OpenFormosa models will follow."

projects:
  # ---------------------------------------------------------------- models
  - id: barbet
    name: "Barbet 1B Base"
    category: models
    status: shipped
    accent: barbet
    crest: base
    role: "Base LM"
    repo: "https://github.com/OpenFormosa/Barbet"
    links:
      - url: "https://huggingface.co/OpenFormosa/barbet-1b-base"
        zh: "Hugging Face 模型"
        en: "Hugging Face model"
      - url: "/blog/2026/08/30/barbet-1b-native-1m/"
        zh: "1M 訓練紀錄"
        en: "1M training log"
      - url: "/blog/2026/06/21/barbet-1b-base/"
        zh: "6 月技術報告"
        en: "June technical report"
    try:
      url: "https://huggingface.co/spaces/voidful/BlueMagpie-TTS-Demo"
      zh: "聽聽 Barbet 驅動的 TTS"
      en: "Hear the TTS that Barbet powers"
    try_dev:
      zh: "用 Transformers 載入"
      en: "Load with Transformers"
      code: |
        from transformers import AutoModelForCausalLM
        model = AutoModelForCausalLM.from_pretrained(
            "OpenFormosa/barbet-1b-base", trust_remote_code=True)
    zh:
      tagline: "一個讀過大量台灣文字的小型語言模型，是其他 OpenFormosa 模型的共同底座。"
      analogy: "把它想成一位記性很好的新同事。它讀過很多文字，很會「接著往下寫」，但還沒學過怎麼聊天。所以它不是聊天機器人，而是讓其他工具站上去的地基。"
      public:
        - "一次能讀 1,048,576 個 token 的長文。Token 是模型切分文字的單位。"
        - "大小約 11 億參數，學校、實驗室與團隊都有機會自己部署與調整。"
        - "BlueMagpie-TTS 裡負責「理解文字」的部分，就是 Barbet。"
      try_note: "Barbet 是基礎模型，不能直接對話。想感受它的成果，最快的方式是聽 BlueMagpie-TTS。"
      research:
        - "約 1.119B 參數的 decoder-only causal LM。28 層，混合 global attention、8K sliding-window attention 與 Mamba 層，GQA（16 query heads、2 KV heads），詞嵌入與 LM head 共用權重，使用 PangolinTokenizer。"
        - "Hugging Face 上的正式權重是 <code>iter7008</code>。它從 64K 逐步接續預訓練到 exact 1M sequences，原生 context 1,048,576，<code>rope_scaling</code> 為 null。這不是只靠 RoPE 外推。"
        - "長文評測：7 類遠距任務中有 6 類顯示，保留遠處的正確資料會提高正確答案的機率。多筆資料合併計算仍未通過。這是 base model 的機率評測，不代表生成作答的正確率。"
        - "6 月的 256K 版本在 TAIDE-14（140 筆，response_only）上為 0.7488 bits/byte。BPB 衡量文字建模，不衡量對話品質。"
        - "Repo 另保留原始 256K 與 1M RoPE 外推的 legacy presets，供舊版研究重現。"
        - "限制：實際跑 1M 需要足夠 GPU 記憶體與 context parallelism。只有 CPU 時，Mamba 走 PyTorch 後備路徑。授權為 Apache 2.0。"
      join: "可以回報載入或轉換問題、補充評測、改善文件。"
    en:
      tagline: "A compact language model that has read a lot of Taiwan text. It is the shared base for the other OpenFormosa models."
      analogy: "Think of it as a new colleague with an excellent memory. It has read a lot and is good at continuing text, but it has not been taught to chat. It is not a chatbot. It is the foundation other tools stand on."
      public:
        - "It can read 1,048,576 tokens of text at once. A token is the unit a model splits text into."
        - "With about 1.1 billion parameters, it is small enough for schools, labs, and teams to deploy and adapt."
        - "The part of BlueMagpie-TTS that understands text is Barbet."
      try_note: "Barbet is a base model and cannot chat. The quickest way to see what it enables is to listen to BlueMagpie-TTS."
      research:
        - "About 1.119B-parameter decoder-only causal LM. 28 layers mixing global attention, 8K sliding-window attention, and Mamba layers, GQA (16 query heads, 2 KV heads), tied embeddings, PangolinTokenizer vocabulary."
        - "The released Hugging Face weights are <code>iter7008</code>, continued-pretrained from 64K up to exact 1M sequences. Native context is 1,048,576 and <code>rope_scaling</code> is null. This is not RoPE extrapolation alone."
        - "Long-context evaluation: in 6 of 7 long-range task families, keeping the correct distant evidence raises the probability of the correct answer. Aggregating several records still fails. These are base-model likelihood tests, not generation accuracy."
        - "The June 256K release scored 0.7488 bits/byte on TAIDE-14 (140 samples, response_only). BPB measures text modeling, not chat quality."
        - "The repo keeps the original 256K and 1M RoPE-extrapolation legacy presets for reproducing earlier research."
        - "Limits: running 1M needs enough GPU memory and context parallelism. On CPU, Mamba falls back to a PyTorch path. Apache 2.0."
      join: "Report loading or conversion issues, add evaluations, or improve the docs."

  - id: bluemagpie
    name: "BlueMagpie-TTS V1"
    category: models
    status: shipped
    accent: bluemagpie
    crest: tts
    role: "TTS"
    repo: "https://github.com/OpenFormosa/BlueMagpie-TTS"
    links:
      - url: "https://huggingface.co/OpenFormosa/BlueMagpie-TTS"
        zh: "Hugging Face 模型"
        en: "Hugging Face model"
      - url: "https://colab.research.google.com/github/OpenFormosa/BlueMagpie-TTS/blob/main/notebooks/BlueMagpie_TTS_Colab.ipynb"
        zh: "Colab 筆記本"
        en: "Colab notebook"
      - url: "/blog/2026/06/23/bluemagpie-tts/"
        zh: "技術紀錄"
        en: "Technical log"
    try:
      url: "https://huggingface.co/spaces/voidful/BlueMagpie-TTS-Demo"
      zh: "線上試聽"
      en: "Try the live demo"
    try_dev:
      zh: "免安裝跑完整流程"
      en: "Run the full pipeline, no install"
      url: "https://colab.research.google.com/github/OpenFormosa/BlueMagpie-TTS/blob/main/notebooks/BlueMagpie_TTS_Colab.ipynb"
      label_zh: "開啟 Colab"
      label_en: "Open in Colab"
    zh:
      tagline: "把文字唸成自然的台灣口音語音。中英夾雜的句子不用改寫。"
      analogy: "像一位熟悉台灣用語的播音員。看到「這個 feature 明天上線」，不會卡住，也不會唸成翻譯腔。"
      public:
        - "輸出 48 kHz 高品質語音，可以邊合成邊播放。"
        - "給一段 3 秒以上的參考音檔，就能模仿那位說話者的音色。請只使用已取得授權的聲音。"
        - "在同一份內部測試集上，每合成 100 個字，唸錯的字約從 11 個降到 7 個。"
        - "適合有聲內容、客服語音、無障礙朗讀與教學。"
      try_note: "不用安裝，打開瀏覽器就能聽。"
      research:
        - "保留 VoxCPM 的聲學架構，把文字語意語言模型換成 Barbet。Barbet 負責語意、韻律與節奏，聲學架構負責聲音細節。"
        - "評測方式：合成語音用 ASR 轉寫回文字，再和原文比對。數字來自內部保留測試集，隨 checkpoint 發佈在 <code>release_metadata.json</code>。這是模型選擇用的評測，不是公開基準。"
        - "CER／WER：語者向量條件 7.44%／8.57%，參考音檔條件（免逐字稿）8.99%／11.77%，同一測試集上的參考基準系統 11.45%／14.83%。語者向量條件的 CER 相對降低約 35%。"
        - "長文逐段合成：語者向量 CER 7.51%，參考音檔 8.92%，語速約 4.0 字／秒。"
        - "Apple Silicon 可用 MLX 原生推論。在 7.75GB 模型上端對端 RTF 0.77（fp32），比 torch-MPS 快約 1.45 倍，比 torch-CPU 快約 3.27 倍。另有 torch-only 的連續批次推論引擎。"
      join: "歡迎回報唸錯的句子、改善硬體支援與效能、補充文件。請不要在 issue 上傳未經授權的錄音。"
    en:
      tagline: "Turns text into natural Taiwan-accented speech. Mixed Chinese and English sentences need no rewriting."
      analogy: "Like a narrator who knows how people in Taiwan talk. A sentence such as “這個 feature 明天上線” does not trip it up."
      public:
        - "It outputs 48 kHz audio and can stream while it speaks."
        - "Give it a reference clip of 3 seconds or more, and it imitates that speaker's voice. Only use voices you have permission to use."
        - "On the same internal test set, mispronounced characters drop from about 11 to about 7 per 100 synthesized characters."
        - "Good for audio content, voice interfaces, accessibility, and teaching."
      try_note: "No install. Open a browser and listen."
      research:
        - "Keeps VoxCPM's acoustic stack and replaces the text-semantic language model with Barbet. Barbet plans meaning, prosody, and rhythm. The acoustic stack renders the sound."
        - "Evaluation: transcribe synthesized speech back with ASR and compare with the input text. Numbers come from an internal held-out set published with the checkpoint in <code>release_metadata.json</code>. This is a model-selection evaluation, not a public benchmark."
        - "CER / WER: speaker-centroid condition 7.44% / 8.57%, reference-audio condition (no transcript) 8.99% / 11.77%, reference baseline on the same set 11.45% / 14.83%. That is about a 35% relative CER reduction for the centroid condition."
        - "Long-form chunked synthesis: centroid CER 7.51%, reference-audio 8.92%, about 4.0 characters per second."
        - "Native MLX inference on Apple Silicon: end-to-end RTF 0.77 on the 7.75GB model (fp32), about 1.45x faster than torch-MPS and 3.27x faster than torch-CPU. A torch-only continuous-batching engine is also included."
      join: "Report sentences it gets wrong, improve hardware support and speed, or improve the docs. Please do not upload unlicensed recordings to issues."

  - id: blackbear
